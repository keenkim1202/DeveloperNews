name: Release TestFlight

on:
  push:
    branches:
      - release

jobs:
  beta:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      FL_EXPORT_METHOD: app-store

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf "%s" "$APP_STORE_CONNECT_KEY_CONTENT" > "$KEY_PATH"
          echo "APP_STORE_CONNECT_KEY_FILE=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        run: bundle exec fastlane ios beta
