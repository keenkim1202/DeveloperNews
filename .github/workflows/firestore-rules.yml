name: Firestore Rules

on:
  pull_request:
    paths:
      - firestore.rules
      - firestore.indexes.json
      - scripts/test-firestore-rules.py
      - functions/**
      - .github/workflows/firestore-rules.yml
  push:
    branches:
      - develop
    paths:
      - firestore.rules
      - firestore.indexes.json
  workflow_dispatch:

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing in the app build exercises the rules — they are the only thing
  # standing between an inbox and forged rows, and a client cannot check them.
  # The probe runs against the emulator, where a denial is observable.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The Firestore emulator is a Java process.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools

      - name: Run the rules probe
        run: firebase emulators:exec --only firestore "python3 scripts/test-firestore-rules.py"

      # The message a push carries is the branchy part of the function and the
      # only piece that runs without Firebase.
      - name: Test the notification text
        run: node --test functions/test/*.test.js

  # Deploying by hand is how the rules and the client drift apart: a merged
  # feature whose rules are still the old ones fails closed, and the writes it
  # makes are swallowed rather than reported.
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools

      - name: Write the service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set. Add the service account JSON as a repository secret." >&2
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_PATH" >> "$GITHUB_ENV"

      # Rules land ahead of the build that ships them, so one that requires a
      # field the released app does not write yet breaks that app. Keep rules
      # changes backward compatible with what is in the store.
      - name: Deploy the rules
        run: firebase deploy --only firestore:rules --non-interactive

      # Separately, and after: an index needs a role the rules do not, and a
      # deploy that does both leaves the rules unreleased when it is missing.
      # The cleanup trigger queries activities across every inbox, and a
      # collection-group query without its index fails when it is used rather
      # than when it is deployed.
      - name: Deploy the indexes
        run: firebase deploy --only firestore:indexes --non-interactive
