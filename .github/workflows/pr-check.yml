name: Pull Request

on:
  pull_request:
  # A Run workflow button in the Actions tab, for a branch with no pull request
  # open yet or a re-run without pushing a commit.
  #
  # It is not a way around the tab's Disable workflow switch: disabling stops
  # every trigger on a workflow, this one included, and the button goes with it.
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            fastlane/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('DeveloperNews.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # `test` needs a concrete device, unlike the generic destination a build
      # accepts. Resolved here rather than hardcoded so a runner image that
      # renames or drops a device model does not silently break the job.
      - name: Select a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys

          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-"))
              for device in devices:
                  if device["name"].startswith("iPhone") and (best is None or version > best[0]):
                      best = (version, device["udid"])
          if best is None:
              sys.exit("no iPhone simulator available on this runner")
          print(best[1])
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -F "$udid"

      # Builds and runs the unit tests. `test` compiles the app target on the
      # way, so this covers what the old build-only step covered.
      - name: Test
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild \
            -project DeveloperNews.xcodeproj \
            -scheme DeveloperNews \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath fastlane/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
